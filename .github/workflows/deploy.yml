name: Deploy Bella to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Public client config only (protected by Row Level Security). Never put the service_role key here.
          VITE_SUPABASE_URL: https://zzqbqdsyigkrjqlwnngt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xLbXWB7SBDNmXyCEsuP_5A_ITpiyNaE
      - run: cp dist/index.html dist/404.html   # SPA deep links on GitHub Pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
